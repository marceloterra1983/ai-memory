# cargo-deny configuration.
# Goal: reject GPL/AGPL transitive deps (license trap that cost cognee #2807)
# and pin to the official crates.io registry.

[graph]
# CI runs cargo-deny with --all-features (see .github/workflows/ci.yml), so build
# the same graph here. This keeps the documented local gate `cargo deny check`
# (AGENTS.md, CONTRIBUTING.md) checking the exact feature set CI enforces, instead
# of the narrower default-features graph.
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
ignore = [
    # RUSTSEC-2024-0436: `paste` is unmaintained. Compile-time
    # proc-macro helper pulled by the candle ML stack (local
    # embeddings); no runtime code ships from it. Revisit when candle
    # replaces it upstream.
    "RUSTSEC-2024-0436",
    # RUSTSEC-2024-0449: `unsafe-libyaml` is unmaintained. Pulled by
    # serde_yaml. In ai-memory-core that is a dev-dependency. In
    # ai-memory-wiki it is a normal dependency: page frontmatter passes
    # through it, and ai-memory-cli links that crate, so the library
    # ships in the binary. The advisory does not describe an exploit
    # seen in this repository. The ignore stays until the wiki stops
    # using serde_yaml.
    "RUSTSEC-2024-0449",
    # RUSTSEC-2026-0367/0368/0369: the three `zip` advisories all
    # concern `ZipArchive::extract()` / `ZipStreamReader::extract()`
    # (SUID/SGID preservation and symlink escapes during extraction).
    # Neither API is called anywhere in this workspace or in
    # candle-core, the only other consumer of `zip` in the graph
    # (in-memory archive reads for pickle/npy only). The one release
    # extractor, `extract_release_zip` in ai-memory-cli, is hand-rolled
    # on `by_index` + `enclosed_name()`, rejects symlink entries, and
    # never applies archive permissions. candle-core 0.11 also pins
    # zip 8.6, so unifying on zip 9 is not yet possible. Revisit when
    # candle moves to zip >= 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
exceptions = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
